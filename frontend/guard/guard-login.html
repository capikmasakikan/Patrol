<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guard Login - Security Patrol</title>
    <link rel="stylesheet" href="css/guard-login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <img src="pikm-logo.png" alt="Logo of PIKM" class="pikm-logo"/>
                <h2>Kawalan Ulung Security</h2>
                <p>Patrol Login</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="guardId">Guard ID</label>
                    <select id="guardId" required>
                        <option value="">Select your ID</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pin">PIN</label>
                    <input 
                        type="password" 
                        id="pin" 
                        placeholder="Enter your 4-digit PIN"
                        maxlength="4"
                        pattern="[0-9]{4}"
                        required
                    >
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Login
                </button>
            </form>

            <div class="footer">
                <p>Security Patrol System</p>
                <a href="../admin/index.html">Admin Login →</a>
            </div>
        </div>
    </div>

    <script src="js/guard-login.js"></script>
</body>
</html>
